[book]
title = "Biblioteca Steam — High Family"
authors = ["High"]
description = "Biblioteca familiar de Steam organizada como mdBook: fundamentos, colecciones, estados, decisión y fichas clave."
language = "es"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
smart-punctuation = true
additional-css = ["theme/custom.css"]
additional-js = ["theme/game-tooltips.js", "theme/sidebar-persist.js", "theme/game-detail.js"]

[output.html.fold]
enable = true
level = 0

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 3
